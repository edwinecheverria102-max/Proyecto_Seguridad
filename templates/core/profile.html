{% extends 'core/base.html' %}
{% load static %}

{% block title %}Mi Perfil | BookOne{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock %}

{% block content %}
<div class="profile-container">
    <h2>Mi Perfil</h2>
    
    <div class="profile-card">
        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" value="Ana López" required>
            </div>

            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" value="ana@correo.com" required>
            </div>
            
            <div class="form-group">
                <label>Nueva Contraseña </label>
                <input type="password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit" style="width: auto; padding: 12px 30px; margin-top: 20px;">
                Guardar Cambios
            </button>
        </form>
    </div>
</div>
{% endblock %}
