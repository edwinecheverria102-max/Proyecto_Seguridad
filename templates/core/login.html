{% extends 'core/base.html' %}
{% load static %}

{% block title %}Iniciar Sesión | BookOne{% endblock  %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Iniciar Sesión</h2>

        <!-- envio de datos a la misma URL-->
        <form method="POST" action="{% url 'core:login' %}">
            {% csrf_token %} <!--seguridad en django-->

            <div class="form-group">
                <label for="id_email">Correo electrónico</label>
                <input type="email" name="email" id="id_email" placeholder="tu@correo.com" required>
            </div>

            <div class="form-group"> 
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <div class="auth-links">
            <p><a href="#">¿Olvidaste tu contraseña?</a></p>
            <p>¿No tienes cuenta <a href="{% url 'core:register' %}">Regístrate aquí</a></p>
        </div>
    </div>
</div>
{% endblock %}
